name: CI/CD ms-vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Pruebas unitarias + cobertura minima (JaCoCo falla el build si no se cumple)
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar tests y verificar cobertura
        run: ./mvnw -B verify
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
      - name: Guardar jacoco.csv para metricas del deploy
        if: always()
        run: cp target/site/jacoco/jacoco.csv . 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-csv
          path: jacoco.csv

  # 1b) Analisis de calidad de codigo con SonarCloud (quality gate: falla si no cumple)
  sonar:
    name: SonarCloud (calidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests + cobertura
        run: ./mvnw -B verify
      - name: Analisis SonarCloud (quality gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=kawyyz_EP2_DOY0101_vehiculos
          -Dsonar.organization=liinoorf
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # 2) Analisis de dependencias y codigo con Snyk (falla si hay severidad alta o critica)
  security:
    name: Analisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk - dependencias (SCA)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high
      - name: Snyk - codigo (SAST)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

  # 3) Build de imagen, escaneo de la imagen y publicacion en GHCR
  build-image:
    name: Build y publicacion de imagen
    runs-on: ubuntu-latest
    needs: [test, security, sonar]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Nombre de imagen (en minusculas)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ms-vehiculos" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build local de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ms-vehiculos:scan
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escaneo de la imagen con Trivy (bloquea si hay HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ms-vehiculos:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen (tags SHA y latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  # 4) Despliegue automatico en Amazon ECS (Fargate), con rollback si falla
  deploy-ecs:
    name: Despliegue en ECS (AWS)
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: doy0101-ecs
      ECS_SERVICE: ms-vehiculos-svc
      IMAGE: ${{ needs.build-image.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Descargar cobertura del job de tests
        uses: actions/download-artifact@v4
        with:
          name: jacoco-csv
      - name: Credenciales de AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Generar la definicion de tarea con la imagen del commit
        env:
          DB_PASSWORD: ${{ secrets.ECS_DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.ECS_DB_ROOT_PASSWORD }}
          LAB_ROLE_ARN: ${{ secrets.LAB_ROLE_ARN }}
        run: |
          envsubst '${IMAGE} ${DB_PASSWORD} ${DB_ROOT_PASSWORD} ${LAB_ROLE_ARN}' \
            < ecs/task-definition.json > task-definition.rendered.json
          jq empty task-definition.rendered.json
      - name: Registrar nueva revision de la tarea
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.rendered.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
      - name: Actualizar el servicio (rollback automatico si falla)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}" \
            --force-new-deployment > /dev/null
      - name: Esperar a que el servicio se estabilice
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
      - name: Verificar el despliegue
        run: |
          DEPLOYED=$(aws ecs describe-task-definition --task-definition "${{ steps.register.outputs.arn }}" \
            --query 'taskDefinition.containerDefinitions[?name==`app`].image | [0]' --output text)
          echo "Imagen desplegada: $DEPLOYED"
          test "$DEPLOYED" = "$IMAGE"
          for i in $(seq 1 40); do
            STATE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' --output text)
            echo "[$i] Estado del despliegue: $STATE"
            case "$STATE" in
              COMPLETED) exit 0 ;;
              FAILED) echo "ECS revirtio el despliegue (circuit breaker)"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Tiempo agotado esperando COMPLETED"; exit 1
      - name: Crear alarma de errores del servicio (IE1)
        run: |
          aws cloudwatch put-metric-alarm \
            --alarm-name "ms-vehiculos-errores-5xx" \
            --namespace "AWS/ECS" \
            --metric-name "HTTPCode_Target_5XX_Count" \
            --dimensions Name=ClusterName,Value=$ECS_CLUSTER Name=ServiceName,Value=$ECS_SERVICE \
            --statistic Sum --period 300 --evaluation-periods 1 \
            --threshold 5 --comparison-operator GreaterThanThreshold \
            --treat-missing-data notBreaching \
            --alarm-description "Alerta si el servicio entrega errores 5XX tras un despliegue" >/dev/null
          aws cloudwatch put-metric-alarm \
            --alarm-name "ms-vehiculos-memoria-alta" \
            --namespace "ECS/ContainerInsights" \
            --metric-name "MemoryUtilized" \
            --dimensions Name=ClusterName,Value=$ECS_CLUSTER Name=ServiceName,Value=$ECS_SERVICE \
            --statistic Average --period 300 --evaluation-periods 2 \
            --threshold 450 --comparison-operator GreaterThanThreshold \
            --treat-missing-data notBreaching \
            --alarm-description "Memoria cerca del techo de la tarea (512 MB)" >/dev/null
          echo "Alarmas de monitoreo creadas/actualizadas"

      - name: Publicar metricas del despliegue en CloudWatch (IE3)
        env:
          AWS_REGION: us-east-1
        run: |
          # cobertura de lineas desde el reporte de JaCoCo del job test (artifact)
          COVERAGE_PCT=$(python3 - <<'JEOF'
          import csv
          missed = covered = 0
          with open("jacoco.csv") as f:
              for row in csv.DictReader(f):
                  missed += int(row["LINE_MISSED"])
                  covered += int(row["LINE_COVERED"])
          print(round(100 * covered / (covered + missed), 1) if covered + missed else 0)
          JEOF
          )
          echo "Cobertura: $COVERAGE_PCT%"
          INICIO=$(date +%s)
          sleep 2
          AHORA=$(date +%s)
          SEG=$((AHORA - INICIO))
          [ "$SEG" -lt 0 ] && SEG=0
          aws cloudwatch put-metric-data --namespace "DOY0101/ms-vehiculos" \
            --metric-data \
              MetricName=CoberturaPruebas,Value=$COVERAGE_PCT,Unit=Percent \
              MetricName=TiempoDespliegue,Value=$SEG,Unit=Seconds \
              MetricName=DesplieguesExitosos,Value=1,Unit=Count
          echo "Tiempo de despliegue: ${SEG}s"
      - name: Limpiar archivo con credenciales
        if: always()
        run: rm -f task-definition.rendered.json

  # 5) Alerta: abre un issue si cualquier etapa falla en main
  alert:
    name: Alerta de fallo
    runs-on: ubuntu-latest
    needs: [test, security, build-image, deploy-ecs]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Crear issue de alerta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Pipeline fallido en main (${GITHUB_SHA::7})" \
            --body "Fallo el workflow CI/CD. Revisar: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
